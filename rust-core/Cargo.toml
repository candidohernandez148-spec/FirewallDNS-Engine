[package]
name = "firewalldns-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "firewalldns_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
rand_core = { version = "0.6.4", features = ["getrandom"] }
