[package]
name = "firewalldns-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "firewalldns_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
