name: DNS Live Resolver Checks

on:
  workflow_dispatch:

jobs:
  live-resolvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Test Cloudflare, Google and Quad9 resolvers
        env:
          FIREWALLDNS_RUN_LIVE_DNS_TESTS: "true"
        run: gradle :dns-engine:test --tests "*DnsLiveResolverIntegrationTest"
