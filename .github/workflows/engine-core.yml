name: Engine Core

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Run JVM and Android adapter unit tests
        run: gradle test
      - name: Assemble Android adapter library
        run: gradle :android-adapter:assembleDebug
      - name: Compile Android on-device benchmark tests
        run: gradle :android-adapter:assembleDebugAndroidTest
