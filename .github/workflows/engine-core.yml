name: Engine Core validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "rust-core/**"
      - "android-adapter/**"
      - "dns-engine/**"
      - "engine-runtime/**"
      - ".github/workflows/engine-core.yml"
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - ".github/workflows/engine-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Test Rust native core and smoltcp transport labs
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Check Android ARM64 Rust target
        run: cargo check --manifest-path rust-core/Cargo.toml --target aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Run JVM unit tests
        run: gradle test
      - name: Assemble Android diagnostics APK
        run: gradle :app:assembleDebug
