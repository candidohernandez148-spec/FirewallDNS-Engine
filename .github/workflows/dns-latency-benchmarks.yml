name: DNS Latency Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dns-latency-benchmarks.yml"
      - "dns-engine/src/test/kotlin/com/firewalldns/engine/dns/DnsLatencyBenchmarkTest.kt"

jobs:
  dns-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Run loopback DNS latency benchmark
        env:
          FIREWALLDNS_RUN_DNS_BENCHMARKS: "true"
        run: gradle :dns-engine:test --tests "*DnsLatencyBenchmarkTest" --info
